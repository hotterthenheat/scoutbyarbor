# Render blueprint for Scout.
#
# ONE service, not two.
#
# The obvious shape is a web service plus a `cron` service running
# `npm run deliveries:replay`. That does not work here: a Render cron job gets
# its own container and Render disks attach to exactly one service, so the cron
# could not see the database at all. It would report "nothing to replay" on
# every run while failed deliveries piled up — a silent failure, which is worse
# than no recovery.
#
# So the replay runs INSIDE the web service on a 5-minute timer
# (REPLAY_INTERVAL_MINUTES), claiming rows in the database so overlapping runs
# can never double-deliver. If you would rather drive it externally, the cron
# block at the bottom of this file calls POST /admin/replay over HTTP, which
# reaches the service that actually owns the disk.
#
# Sprout stays a separate service. Sprout going down must not take Scout's news
# ingestion down with it.
#
# ─────────────────────────────────────────────────────────────────────────────
# READ THIS BEFORE TRUSTING THIS DEPLOYMENT WITH TRADING ALERTS
#
# This blueprint runs Scout on the FREE instance type (0.1 CPU / 512 MB), by
# explicit choice. Two consequences follow from that, and neither is a bug to
# be fixed later — they are what the free tier is:
#
#   1. IT SLEEPS. Free instances spin down after inactivity. Scout is an
#      always-on worker holding two Discord gateway connections and several
#      timers; a wire that is asleep at 3am is precisely the failure this whole
#      design exists to prevent. Breaking news arriving during a spin-down is
#      not delayed, it is missed.
#
#   2. IT FORGETS. Free instances cannot mount a persistent disk, so the SQLite
#      database sits on ephemeral storage. Every restart and every deploy wipes
#      it: the processed-post set that makes dedupe work, the delivery log the
#      Sprout replay reads, and the calendar-fired keys that stop a reminder
#      firing twice. Scout will repost recent history on boot, and
#      `GET /metrics` will report `storage.boots: 1` and
#      `durability: UNPROVEN` forever. The two-deploy persistence check cannot
#      pass on this configuration, by construction.
#
# Scout says both of these out loud on every boot, in the log stream and in
# #scout-system. Those warnings are correct here and must not be silenced.
#
# To get an always-on Scout with durable storage: set `plan: starter`
# (0.5 CPU / 512 MB), restore the `disk:` block with mountPath /var/data, and
# set DATABASE_PATH back to /var/data/scout.db.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: scout
    runtime: node
    # 0.1 CPU / 512 MB. On Render 0.1 CPU is ONLY available as the free
    # instance type, so this is that — chosen deliberately, with the costs
    # below accepted. Revert with `plan: starter` (0.5 CPU) and restore the
    # disk block to get an always-on Scout with durable storage back.
    plan: free
    region: oregon
    # Must name a branch that actually exists on the remote, or the blueprint
    # fails before it builds. This repo has no `main` yet.
    branch: claude/scout-news-bot-spec-bz2q6y
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health

    # NO DISK. Free instances cannot mount one, so there is nowhere durable to
    # put the database. See the header for what that costs.

    envVars:
      - key: NODE_VERSION
        value: "22"
      # Ephemeral, because there is no disk to point at. /tmp exists, so Scout
      # boots; it warns on every start that this storage does not survive a
      # restart, which is accurate and should not be silenced.
      - key: DATABASE_PATH
        value: /tmp/scout.db
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: info

      # ── Required. Set these in the Render dashboard, never in this file ──
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false

      # ── Webhook ingestion. Set this and give the upstream source the URL
      # https://<scout-domain>/webhook/news plus this token. ──
      - key: SCOUT_WEBHOOK_TOKEN
        sync: false

      # ── OPTIONAL. Scout runs fully without this ──
      # The primary ingestion path reads the content the permitted relay already
      # posted alongside the link, which needs no credential. An X API resolver
      # is only a fallback for links relayed without their text. Leaving this
      # unset is a normal configuration, not a fault, and Scout logs
      # "X API: NOT CONFIGURED — URL/RELAY INGESTION: ENABLED" on boot.
      - key: X_BEARER_TOKEN
        sync: false

      # ── Primary channels ──
      - key: DISCORD_CHANNEL_NEWS
        sync: false
      - key: DISCORD_CHANNEL_TRADING_FLOOR
        sync: false
      - key: DISCORD_CHANNEL_SPX
        sync: false
      - key: DISCORD_CHANNEL_RAW
        sync: false
      - key: DISCORD_CHANNEL_SYSTEM
        sync: false

      # ── Watched input channels for URL ingestion ──
      - key: NEWS_SOURCE_CHANNEL_IDS
        sync: false
      - key: TRUTH_SOCIAL_CHANNEL_IDS
        sync: false
      - key: ADMIN_INPUT_CHANNEL_IDS
        sync: false
      - key: ALLOWED_X_ACCOUNTS
        sync: false

      - key: SEC_USER_AGENT
        sync: false

      # ── Sprout hand-off. Optional; unset means Scout publishes to Discord
      # only and records every Sprout delivery as SKIPPED. ──
      - key: SPROUT_URL
        sync: false
      - key: SPROUT_TOKEN
        sync: false

      # ── Automatic Sprout recovery ──
      # Runs in-process; see the note at the top of this file for why this is
      # not a separate cron service.
      - key: REPLAY_ENABLED
        value: "true"
      - key: REPLAY_INTERVAL_MINUTES
        value: "5"
      - key: REPLAY_WINDOW_MINUTES
        value: "60"
      - key: REPLAY_LIMIT
        value: "100"

      # ── Tuning ──
      - key: RESOLVE_TIMEOUT_SECONDS
        value: "10"
      - key: INGEST_CONCURRENCY
        value: "4"
      - key: SPROUT_MAX_AGE_MINUTES
        value: "30"
      - key: MIN_PUBLISH_SCORE
        value: "60"
      - key: MIN_BREAKING_SCORE
        value: "90"

# ─────────────────────────────────────────────────────────────────────────────
# OPTIONAL: drive the replay externally instead of in-process.
#
# Only use this if you set REPLAY_ENABLED=false above — otherwise both would
# run, which is safe (the database claim prevents double delivery) but wasteful.
#
# This calls the web service over HTTP rather than running the CLI, because a
# cron container cannot reach the web service's disk. SCOUT_URL is the service's
# own URL. SCOUT_ADMIN_TOKEN must be set explicitly and must NOT be the webhook
# token — that one is handed to the upstream relay, and an ingestion credential
# has no business authorizing an operational endpoint. Unset leaves
# POST /admin/replay disabled.
