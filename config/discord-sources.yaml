# ─────────────────────────────────────────────────────────────────────────────
# SCOUT — Discord intelligence sources
#
# A second ingestion source alongside the X webhook path. Both feed the SAME
# normalization, dedupe, classification, scoring and routing pipeline; nothing
# here is a parallel implementation.
#
# ── HOW MESSAGES GET HERE ────────────────────────────────────────────────────
#
# Two ways, and they feed the same allowlist, worker and pipeline.
#
# 1. INTAKE CHANNEL (`intake: true`). Scout's own bot reads a channel in a
#    server you control, using ordinary permissions — View Channel, Read
#    Message History, Read Message Content, Send Messages — plus the MESSAGE
#    CONTENT intent in the developer portal. Anything you post or forward there
#    becomes an input. This is how you feed Scout from a server it is not in:
#    forward the message, and Scout reads the forward.
#
# 2. AUTHORIZED BRIDGE (the default). A bot the server owner installed, an
#    official API or partner feed, or any relay you are permitted to run POSTs
#    messages to:
#
#        POST /webhook/discord   Authorization: Bearer $DISCORD_INTEL_TOKEN
#
# What Scout will NOT do is read a server it was not invited to by automating a
# personal account. A user token, session cookie, browser replay or self-bot
# violates Discord's terms and gets the account terminated — taking the servers,
# the intake channel and Scout's own feed down with it. The intake channel above
# solves the same problem with permissions you are allowed to have.
#
# ── ATTRIBUTION THROUGH A FORWARD ────────────────────────────────────────────
#
# A forwarded message has two accounts attached: whoever originally said it and
# whoever forwarded it. Only the first is a source, and Scout never promotes the
# forwarder into the byline.
#
# What survives the hop depends on how it was forwarded. Discord's native
# forward carries the original content, embeds and TIMESTAMP but deliberately
# not the original author — so such an event is recorded as `unattributed via
# <forwarder>` rather than credited to anyone. Relay bots that stamp the
# original author onto the embed preserve both halves, and are read accordingly.
# Scout does not guess the missing half.
#
# ── FILTERING ────────────────────────────────────────────────────────────────
#
# `channels` is an ALLOWLIST. A message from a channel not listed here is
# rejected, not merely deprioritised — an intelligence source you did not
# configure must never reach a trading channel.
#
# `authors` is optional. Empty accepts every author in an allowed channel;
# populated restricts to those authors. Names are matched case-insensitively
# against the author's display name, with or without a discriminator.
#
# Scores are seeds for the SAME six-component scorer every other source uses.
# A higher qualityScore raises the sourceQuality component; it does not bypass
# classification, the noise filters, or the market-impact test. Nothing here can
# force a message into #trading-floor.
# ─────────────────────────────────────────────────────────────────────────────
version: 1

# ── DESTINATIONS ─────────────────────────────────────────────────────────────
# Where refined intelligence goes. Declared here so the routing map is readable
# in one place rather than spread across dashboard variables. Each overrides the
# corresponding DISCORD_CHANNEL_* env var; leave one out to keep the env value.
#
#   general    every accepted event, in Scout's alert format
#   spx_macro  index-level and macro: SPX/SPY/QQQ, Fed, CPI/PPI/NFP/GDP, rates,
#              major geopolitical, commodities, market-wide risk
#   tickers    single-name: company news, earnings, guidance, M&A, analyst
#              actions, product/regulatory developments, options catalysts
#
# An event that is BOTH macro and single-name reaches both. An event that is
# neither reaches general only. The decision is the market-impact classifier's,
# never the source's.
#
# NO CHANNEL MAY BE BOTH A DESTINATION AND A SOURCE. Scout would publish an
# alert into it, read that alert back as intelligence and re-publish — a loop
# that looks like a very busy news day from the outside. The loader rejects the
# overlap at boot rather than letting it be discovered in production.
#
# `general` is intentionally unset here: 1513342006342979635 is now the INTAKE
# channel below, so the general feed needs its own channel. Set
# DISCORD_CHANNEL_NEWS to it, or fill `general` in here — Scout refuses to boot
# with neither, because every qualified alert routes there.
destinations:
  spx_macro: "1510553508351311922"
  tickers: "1510553837897781259"

# ── SOURCE CHANNELS ──────────────────────────────────────────────────────────
# An ALLOWLIST. A message from a channel not listed here is rejected outright,
# not merely deprioritised.
channels:
  # Scout's own intake channel. Post or forward anything here and it becomes an
  # input — no bridge, no API key, no token beyond the bot's own.
  - id: "1513342006342979635"
    sourceId: discord:scout-intake
    name: Scout Intake
    enabled: true
    intake: true
    # The intake channel is exactly as trustworthy as what gets forwarded into
    # it, which varies. A middling seed lets a genuinely important forward
    # compete without letting an idle one through; the market-impact test still
    # decides whether anything reaches a trading channel.
    qualityScore: 70
    noiseScore: 30
    filterProfile: standard
    # Empty: anyone who can post in the intake channel can feed Scout. Since the
    # channel is in a server you control, its permissions ARE the allowlist. Add
    # names here to narrow it further — matched against whoever posts in the
    # channel, which for a forward is the forwarder, not the original author.
    authors: []

  - id: "1081082844807434292"
    sourceId: discord:arbor-intel
    name: Arbor Intelligence Source
    enabled: true
    # Seeds the SAME sourceQuality component an X account uses. It changes how a
    # message competes; it cannot bypass classification, the noise filters or
    # the market-impact test, and it cannot force anything into a trading
    # channel. Tune it after a week of real traffic, not before.
    qualityScore: 80
    noiseScore: 30
    filterProfile: standard
    # No author list: every author in this channel is accepted. Add names here
    # to narrow it — see the format below.
    authors: []

# ─────────────────────────────────────────────────────────────────────────────
# Adding more channels. Format:
#
#   channels:
#     - id: "1234567890123456789"        # Discord channel id (snowflake)
#       sourceId: discord:flow-alerts    # Scout source id; must start `discord:`
#       name: Flow Alerts
#       enabled: true
#       intake: false                    # true = Scout's own bot reads it
#                                        # false/absent = a bridge POSTs it in
#       qualityScore: 85                 # 0-100, seeds the sourceQuality component
#       noiseScore: 25                   # 0-100, higher means noisier
#       filterProfile: standard          # standard | strict
#       # Optional author allowlist. Empty/absent = every author in the channel.
#       authors:
#         - name: unusual_whales_crier
#           qualityScore: 90             # optional per-author override
#         - name: OwlsKeyLevelsBot
#           qualityScore: 80
#
# `filterProfile: strict` requires the factuality gate to return FACTUAL_NEWS
# before anything from the channel reaches the wire — use it for feeds that mix
# reporting with commentary.
#
# Find a channel id: Discord → Settings → Advanced → Developer Mode, then
# right-click the channel → Copy Channel ID.
# ─────────────────────────────────────────────────────────────────────────────
