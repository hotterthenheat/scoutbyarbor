# ─────────────────────────────────────────────────────────────────────────────
# SCOUT — scheduled economic calendar
#
# Scout fires a reminder into #scout-news, #trading-floor and #spx-trading at
# three lead times before each event: the day before, an hour before, and
# fifteen minutes before. The release itself is then picked up by the normal
# pipeline from the official feed (BLS, BEA, the Fed).
#
#   SCOUT REMINDER
#
#   CPI TOMORROW
#
#   8:30 AM ET
#
#   EXPECTED IMPACT: CRITICAL
#
# `scheduledAt` MUST carry an explicit UTC offset — -04:00 during EDT, -05:00
# during EST. Writing a bare local time is how a reminder ends up an hour out
# across a daylight-saving boundary.
#
# Keep this file current; entries in the past are simply ignored.
# ─────────────────────────────────────────────────────────────────────────────
version: 1
timeZone: America/New_York

events: []
# ─────────────────────────────────────────────────────────────────────────────
# DELIBERATELY EMPTY.
#
# A reminder is routed to #scout-news, #trading-floor AND #spx-trading — see
# routeCalendarReminder(). A wrong date therefore does not produce a harmless
# note in a side channel; it announces "CPI TOMORROW" to the trading channels
# for a release that is not happening. A guessed calendar is worse than none.
#
# Populate this from the published BLS and Federal Reserve schedules, not from
# memory, then redeploy. Format:
#
#   events:
#     - id: cpi-2026-08
#       name: CPI
#       scheduledAt: "2026-08-12T08:30:00-04:00"   # explicit offset, always
#       expectedImpact: CRITICAL
#       note: July consumer price index, Bureau of Labor Statistics.
#
# expectedImpact is one of CRITICAL | HIGH | MODERATE.
# scheduledAt MUST carry an explicit UTC offset: -04:00 during EDT, -05:00
# during EST. A bare local time is how a reminder lands an hour out across the
# daylight-saving boundary.
#
# Entries in the past are ignored, so a stale file goes quiet rather than
# firing late. An empty list simply means no reminders.
# ─────────────────────────────────────────────────────────────────────────────
