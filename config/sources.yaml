# ─────────────────────────────────────────────────────────────────────────────
# SCOUT — source watchlist (§29, §36)
#
# This file is the whole source list. Add or remove an account here and run
# `npm run sources:sync` — no application code changes (§36).
#
# Curation rule (§5, §30): optimise for signal density, not account count. An
# account posting 20 times a day with 18 useful posts beats one posting 100
# times with 5. Anything whose primary function is telling people what to think
# rather than reporting information does not belong in this file.
#
# `enabled: false` entries are staged but not polled. Run
# `npm run sources:verify` to confirm every handle and feed URL actually
# resolves before enabling it — do not trust a handle just because a list
# somewhere claims it exists (§29).
#
# Scores are seeds. The pipeline updates useful_post_ratio and noise from
# observed behaviour, and `npm run scout source:report` shows the drift (§28).
# ─────────────────────────────────────────────────────────────────────────────
version: 1

