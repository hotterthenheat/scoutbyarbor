  # ══════════════════════════════════════════════════════════════════════════
  # FINNHUB — POLLED MARKET NEWS
  #
  # Scout ASKS for the news on a timer. Nothing has to be pasted, forwarded or
  # pushed by anyone, which is what separates this from the webhook: a webhook
  # sits waiting for a sender, and there is no free sender for X.
  #
  # Needs FINNHUB_API_KEY. Without it the adapter is not registered at all — no
  # failing polls, no health noise — exactly as with an absent X token.
  #
  # Finnhub is a TRANSPORT. Each item names the outlet that actually reported
  # it, and that outlet is what provenance shows and what corroboration counts.
  # A story is never attributed to "Finnhub".
  # ══════════════════════════════════════════════════════════════════════════
  - id: finnhub:general
