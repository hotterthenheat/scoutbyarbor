  # ══════════════════════════════════════════════════════════════════════════
  # OFFICIAL SOURCES ON X — handles supplied and confirmed by the operator
  #
  # TIERED, because "official" means CREDIBLE, not IMPORTANT. @BLS_gov posting
  # CPI is a trading event; @BLS_gov posting a hiring notice is not. Tier sets
  # the sourceQuality seed and the priority; the category classifier, the noise
  # filters and the market-impact test still decide every alert. No source in
  # this file can put anything into a trading channel on its own.
  #
  #   TIER 1  direct market data — the release itself
  #   TIER 2  macro / policy — matters, rarely instantaneous
  #   TIER 3  context — credibility weight, seldom the alert
  #
  # `org` matters as much as the handle. Every feed of one body shares it, so
  # the Fed's RSS feed and the Fed's X account are ONE confirmation rather than
  # two. Without it every release would look independently corroborated by an
  # agency agreeing with itself.
  #
  # NOTE ON POLLING: with X_BEARER_TOKEN unset these are not polled. They still
  # score and attribute correctly when the same account reaches Scout through
  # the Discord relay or the webhook. Direct polling needs a bearer token.
  # ══════════════════════════════════════════════════════════════════════════

