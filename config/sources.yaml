  # ══════════════════════════════════════════════════════════════════════════
  # CONTINUOUS FREE FEEDS
  #
  # The agency feeds above are authoritative and SLOW — a handful of releases a
  # day, on a published schedule. On their own they leave the wire silent for
  # hours, which reads like a broken bot rather than a quiet morning.
  #
  # Everything below publishes CONTINUOUSLY, needs no API key, and needs no
  # permission from anyone. This is what makes Scout an automatic wire instead
  # of something you have to feed.
  #
  # They are also noisier, and are scored honestly for it: a high noiseScore
  # makes an item compete poorly, `filterProfile: strict` requires the
  # factuality gate to return FACTUAL_NEWS before anything reaches the wire, and
  # the market-impact test still decides the trading channels. A newswire
  # publishing constantly does not get to flood #spx-trading.
  #
  # If one of these 404s it shows up as DISCONNECTED on the dashboard with the
  # actual error, costs nothing, and can be deleted. A dead feed is a health
  # warning; it is never a wrong alert.
  # ══════════════════════════════════════════════════════════════════════════

