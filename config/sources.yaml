    noiseScore: 10
    macroScore: 85
    microScore: 85
    geopoliticalScore: 90
    filterProfile: standard
    expectedIntervalMs: 3600000
    notes: >-
      URLs detected in NEWS_SOURCE_CHANNEL_IDS / TRUTH_SOCIAL_CHANNEL_IDS /
      ADMIN_INPUT_CHANNEL_IDS. Constrain which accounts are accepted with
      ALLOWED_X_ACCOUNTS rather than by trusting whoever pasted the link.
