# ─────────────────────────────────────────────────────────────────────────────
# SCOUT — classification taxonomy (§4, §8, §20)
#
# Keywords and phrases are matched case-insensitively on word boundaries;
# multiword entries must appear as a contiguous phrase. `phrases` weigh 3x a
# `keywords` hit — they are the entries that are strong evidence on their own.
#
# `requires` is the anti-noise mechanism: a category with a requires list cannot
# fire unless one of those terms also matches. MARKET and EQUITY both use it, so
# ordinary price chatter cannot become an alert (§4: "Do NOT turn ordinary
# market movement into alerts").
#
# Edit this file and restart — no code change needed.
# ─────────────────────────────────────────────────────────────────────────────
